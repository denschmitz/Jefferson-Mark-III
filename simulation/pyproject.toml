[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jefferson-sim"
version = "0.1.0"
description = "First-pass Jefferson Mark III Charter simulation engine."
requires-python = ">=3.11"
dependencies = [
  "mesa",
  "PyYAML",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
