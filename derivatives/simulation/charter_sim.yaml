meta:
  title: Charter simulation derivative
  version: 0.8-draft
  source: charter/charter.md
  charter_version: 0.8
  status: aligned-draft
  derivative_type: rules_configuration
  alignment_review_date: 2026-05-04

polity:
  sovereign_body: subscribers
  membership_unit: subscriber
  representation_unit: representation_token
  national_decision_threshold: 0.60
  national_decision:
    default_approval_threshold: 0.60
    denominator: all_subscribers
    unresolved_mechanics:
      - quorum_rules
      - abstention_handling
      - eligibility_snapshot_timing
      - rapid_membership_change_handling

actors:
  subscriber:
    description: Base political member holding one representation token.
  representative:
    description: Subscriber receiving delegated representation from other Subscribers.
  authority:
    description: Governance body formed under Article II with sealed functional scope.
  charter_court:
    description: Constitutional court with authority over rights, scope conflicts, and Charter interpretation.
  eco:
    description: Executive Coordination Office for cross-Authority logistics, information, and administration.
  caes:
    description: Cross-Authority Enforcement Service executing Charter Court orders only.
  qualified_person:
    description: Person certified by an Authority-Certification Body for a designated service domain.
  authority_certification_body:
    description: Independent certification body for Qualified Persons.
  coordination_council:
    description: Randomly selected body resolving Authority scope conflicts for a term of no more than twelve months.
  deliberation_assembly:
    description: Randomly selected body evaluating petitions for scope, feasibility, and rights compliance.
  arbitration_authority:
    description: Randomly selected one-year body for unresolved consolidation disputes.
  consolidation_conflict_authority:
    description: Temporary seven-member body adjudicating disputes during consolidation cycles.
  clemency_jury:
    description: Twelve-member lot-selected body empowered to grant individual clemency by two-thirds vote.
  civilian_oversight_board:
    description: Lot-selected Qualified Persons supervising the Defense Authority.

authority_rules:
  formation_thresholds:
    coercive: 0.75
    non_coercive: 0.60
  charter_requirements:
    - scope
    - funding_sources
    - renewal_process
    - oversight_structures
  scope_rules:
    sealed_scope_required: true
    out_of_scope_actions_void: true
    no_unenumerated_powers: true
    scope_expansion_requires_rechartering: true
    scope_transfer_requires_rechartering: true
  review_and_renewal:
    structural_review_interval_years: 5
    renewal_threshold: 0.50
    renewal_electorate: subscribers_within_authority_scope
    mandatory_reauthorization:
      satisfaction_threshold: 0.40
      duration_months: 12
      satisfaction_measurement_status: unresolved_in_canonical_text
  inter_authority_compacts:
    expiry_years: 1
    renewal_requires_explicit_reauthorization: true
  conflict_resolution:
    coordination_council:
      selection: random
      max_term_months: 12
    harmonization_rule:
      higher_majority_prevails: true
      narrower_scope_breaks_ties: true
      charter_court_harmonization_order_max_months: 12
    territorial_fallback:
      direct_physical_mandate_prevails: true
      fallback_to_lead_emergency_authority: true
      physical_operations_only: true
      charter_court_reviewable: true
  scoped_electorates:
    initial_formation_electorate_status: unresolved_for_inherently_territorial_authorities
    renewal_uses_subscribers_within_scope: true

legislation:
  default_pass_threshold: simple_majority
  duration_bands:
    - min_approval: 0.51
      max_approval: 0.54
      duration_years: 1
    - min_approval: 0.55
      max_approval: 0.64
      duration_years: 3
    - min_approval: 0.65
      max_approval: 0.74
      duration_years: 6
    - min_approval: 0.75
      max_approval: 1.00
      duration_years: 10
  expired_acts_return_to_review: true
  emergency_acts_follow_article_v: true
  funding_acts_required_for_tax_activation: true
  fiscal_acts:
    auto_sunset_required: true
    scope_alignment_required: true
    rate_caps_required: true

emergency:
  qualifying_conditions:
    - threat_to_life
    - threat_to_essential_infrastructure
    - threat_to_security
    - threat_to_governance_continuity
  lead_emergency_authority:
    recognition_body: eco
    recognition_basis: functional_jurisdiction_over_precipitating_threat
    initial_duration_days: 30
    extension_to_days: 90
    extension_requires_all_affected_authorities: true
    extension_beyond_one_year_requires_national_decision: true
  publication_deadline_days: 7
  expires_with_emergency: true
  charter_court_review_required: true
  provisional_activation:
    enabled: true
    max_duration_hours: 72
    notify_eco_immediately: true
    notify_charter_court_immediately: true
    limited_to_life_or_critical_system_preservation: true

representation:
  delegation:
    token_per_subscriber: 1
    delegation_is_voluntary: true
    delegation_is_reversible: true
    activation_delay_days: 30
    fractional_delegation_permitted: true
    max_changes_per_12_months: 2
    public_log_required: true
  weighting:
    formula_text: W = R^0.75
    intended_properties:
      - monotonic
      - concave
      - diminishing_marginal_influence
      - normalized_at_single_token
      - amendable_only_by_charter_amendment
    notation_status: incomplete_in_canonical_text
    unresolved_mechanics:
      - domain_statement
      - normalization_rule
      - aggregation_constraints
      - relationship_between_raw_weighted_and_voting_power
  caps:
    max_raw_delegation_share: 0.01
    weighted_delegation_cannot_exceed_cap: true
    excess_returned_for_reassignment: true
    annual_public_audit_required: true
    coalitions_treated_as_single_representative: true
    consolidated_persona_rule: true
  stabilization:
    trigger_share_of_tokens: 0.05
    trigger_window_days: 14
    extension_days: 30
    affects_activation_dates_only: true
    charter_court_may_suspend_for:
      - fraud
      - coercion
      - coordinated_manipulation
    repeated_trigger_window_months: 6
    repeated_trigger_creates_presumption_of_manipulation: true

petitions:
  origination_open_to_all_subscribers: true
  support_threshold:
    percent_of_subscribers: 0.001
    absolute_supporters: 10000
    threshold_rule: whichever_is_met
  deliberation_assembly:
    selection: random
    review_dimensions:
      - scope
      - feasibility
      - rights_compliance
  approved_petitions_become: draft_acts
  cooling_period_days: 30
  no_scope_fallback:
    creates_temporary_authority: true
    max_duration_months: 12
    governance_mechanics_status: unresolved_in_canonical_text
  protections:
    equal_access_required: true
    max_active_petitions_supported_per_subscriber: 10
    merge_substantially_similar_petitions: true

rights:
  baseline_rights:
    - due_process
    - transparent_legislative_proceedings
    - transparent_administrative_proceedings
    - participation_in_petitioning_delegation_and_governance
    - access_to_publicly_logged_information_except_privacy_protected_data
    - no_compelled_delegation
    - no_compelled_association
  unalienable_rights:
    - life
    - bodily_autonomy
    - freedom_of_thought
    - freedom_of_expression
    - freedom_of_conscience
    - privacy
    - secure_possession_of_personal_data
    - freedom_from_coercion_except_under_due_process
    - equitable_treatment_and_protection
  civil_and_procedural_rights:
    - redress_before_impartial_tribunals
    - transparent_enforcement_processes
    - political_participation_without_discrimination
    - freedom_of_assembly_and_association
    - freedom_of_movement_subject_to_narrow_time_limited_safety_measures

judiciary:
  charter_court:
    seats: 9
    selection: lot
    term_years: 6
    renewable: false
    jurisdiction:
      - unalienable_rights
      - civil_rights
      - authority_scope_conflicts
      - constitutional_interpretation
    invalidation_vote_requirement: 6_of_9
    may_legislate: false
    may_initiate_budgetary_measures: false
    decisions_bind_all_authorities: true
  authority_courts:
    permitted: true
    appeals_to_charter_court_limited_to:
      - rights_issues
      - cross_authority_issues
  caes:
    executes_only_charter_court_orders: true
    selection: lot
    term_months: 18
    may_initiate_enforcement: false
    may_initiate_policy: false
    authorities_may_not_obstruct: true
  clemency:
    emergency_stay_max_days: 30
    stay_issuers:
      - charter_court
      - three_member_lot_selected_panel
    clemency_jury_size: 12
    clemency_vote_threshold: 0.6667
    clemency_types:
      - pardon
      - commutation
      - reprieve
    eligible_petitioners:
      - affected_individual
      - delegate
      - counsel
      - prosecuting_authority
    final_except_procedural_defect_review: true
    public_logging_required_except_privacy_protected_portions: true
    may_not_alter_acts: true
    may_not_grant_prospective_immunity: true
    may_not_expand_authority_scope: true
    may_not_modify_charter_rights: true

consolidation:
  decennial_review_interval_years: 10
  governance_credit_limit:
    authorities_per_subscribers: 1_per_50000
    override_requires_national_decision: true
  transparency_required: true
  unresolved_disputes_referred_to:
    body: arbitration_authority
    selection: random
    term_years: 1
  appeals:
    to_charter_court_for:
      - rights_violations
      - procedural_violations
  consolidation_conflict_authority:
    enabled: true
    seats: 7
    qualification_domain: civic_oversight
    selection: lot
    term_months: 18
    renewable: false
    resolves:
      - merger_or_dissolution_disputes
      - strategic_obstruction_allegations
      - artificial_scope_fragmentation_claims
      - decoy_authority_claims
      - consolidation_metric_challenges
      - authority_charter_conflicts_with_consolidation_mandates
    tests:
      - functional_necessity_test
      - scope_integrity_test
      - anti_fragmentation_test
      - efficiency_test
    majority_vote_may_order:
      - mergers
      - separations
      - scope_boundary_adjustments
      - decoy_authority_invalidation
      - subscriber_reauthorization
    prohibited_actions:
      - modify_charter_text
      - modify_legislative_acts
      - modify_funding_levels
      - expand_authority_scope
    appeals_to_charter_court_limited_to:
      - procedural_defect
      - rights_violation
    public_logging_required: true

coordination_and_defense:
  eco:
    functions:
      - logistics
      - information_coordination
      - administrative_coordination
    staffed_by: qualified_persons_for_emergency_coordination
    public_logging_real_time: true
    executive_director:
      election_method: ranked_choice_vote
      electorate: all_subscribers
      term_years: 4
      max_terms: 2
    may_declare_emergencies: false
    may_command_coercive_force: false
  defense_authority:
    creation_or_dissolution_threshold: 0.75
    scope:
      - external_defense
      - external_intelligence
    civilian_oversight_board_selected_by_lot: true
    separate_from_civil_enforcement: true
    domestic_action_prohibited_except_validated_article_v_emergency: true
    political_neutrality_required: true
    funding_through_treasury_authority: true

treasury:
  treasury_authority:
    permanent: true
    executes_charter_authorized_fiscal_operations: true
    may_propose_taxes: false
    may_redirect_funds: false
    may_exercise_policy_discretion: false
    administrators:
      qualification_domain: fiscal_administration
      selection: lot
      term_years: 3
      renewable: false
  responsibilities:
    - collect_authorized_revenues
    - custody_of_public_ledgers
    - disburse_directed_funds
    - manage_unused_fund_reversions
    - standardize_fiscal_data
  tax_categories:
    - activity_linked_levies
    - access_fees
    - risk_indexed_assessments
    - externality_charges
    - general_contribution_surcharge
    - emergency_levy
    - authority_specific_surtaxes
  prohibited_taxation:
    - taxes_on_delegation_patterns
    - retrospective_taxes
    - non_expiring_taxes
    - compelled_alignment_taxes
    - taxes_outside_enumerated_categories
  activation_and_duration:
    funding_acts_required: true
    auto_sunset_required: true
    scope_alignment_required: true
    rate_caps_required: true
  distribution_to_authorities:
    dedicated_accounts_required: true
    use_restriction_required: true
    conditional_releases_supported: true
    transfer_rules_required: true
    unused_fund_reversion_required: true
  distribution_to_individuals:
    direct_disbursement_rules_required: true
    eligibility_boundaries_required: true
    privacy_protections_required: true
  transparency_and_audit:
    real_time_ledger: true
    annual_audits: true
    charter_court_review: true

amendment_and_interpretation:
  charter_amendment_threshold: 0.70
  charter_amendment_requires_national_decision: true
  minimal_necessary_power_rule: true
  emergency_continuity_procedures_apply_until_normal_governance_resumes: true

definitions:
  lead_emergency_authority: authority_first_declaring_qualifying_emergency_and_recognized_by_eco_as_functionally_jurisdictional
  national_decision: approval_threshold_requiring_60_percent_of_all_subscribers_unless_otherwise_specified
  privacy_protected_information:
    includes:
      - health
      - identity
      - communication
      - finances
      - location
      - other_intimate_details_intrinsic_to_personal_autonomy
    may_be_operationalized_by_legislative_acts: true
    may_not_be_narrowed_to_infringe_articles_xvi_or_xvii: true
  qualified_person: certified_by_authority_certification_body
  authority: governance_body_formed_under_article_ii_with_sealed_functional_scope
  representative: subscriber_receiving_delegation_tokens_from_others
  authority_certification_bodies:
    independent: true
    certify_qualified_persons: true
    standards_publicly_transparent: true
    standards_open_to_examination: true
    charter_court_review: true
    discrimination_limited_to_competence_and_ethical_criteria: true

supremacy_and_transition:
  supremacy:
    charter_is_supreme_governing_instrument: true
    conflicting_lower_law_void_to_extent_of_conflict: true
    adopting_jurisdictions_incorporate_authorities_within_scope: true
  adoption:
    requires_national_decision: true
  transition:
    initial_subscribers_are_voluntary_registrants: true
    provisional_acbs_valid_up_to_years: 3
    initial_qualified_persons_drawn_from_publicly_credentialed_professionals: true
    initial_authorities_may_use_simplified_majority_for_first_charters: true
    transition_expiry:
      first_full_consolidation_cycle_or_years: 10

mesa_integration:
  intended_role: configuration_for_charter_rules_engine_consumed_by_mesa_adapter
  not_executable_by_mesa_directly: true
  model_time_unit: day
  random_selection_terms:
    - random
    - lot
  recommended_agent_categories:
    - subscriber
    - representative
    - authority
    - court_or_review_body
    - coordination_body
  recommended_engine_services:
    - yaml_loading_and_validation
    - threshold_evaluation
    - scope_validation
    - delegation_weighting
    - cap_enforcement
    - stabilization_scheduling
    - petition_progression
    - emergency_lifecycle
    - act_duration_calculation
    - rights_constraint_checks
    - public_log_event_generation
  recommended_mesa_adapter_services:
    - model_initialization_from_engine_state
    - agent_creation_and_registration
    - step_order_coordination
    - agentset_queries
    - datacollector_metric_exports
  compatibility_notes:
    - Use Mesa as the agent-based runtime and keep Charter interpretation in a pure rules engine.
    - Treat this YAML as structured constitutional input, not as Mesa code.
    - Preserve unresolved canonical ambiguity as explicit engine gaps until the Charter is amended or guidance is supplied.

known_simulation_gaps:
  - representation_weighting_formula_mechanics
  - subscriber_approval_denominator_quorum_and_abstention_rules
  - raw_vs_weighted_voting_power_relationship
  - coercive_authority_classification_test
  - temporary_authority_governance_mechanics
  - scoped_electorates_for_inherently_territorial_authorities
  - satisfaction_rating_measurement
  - coalition_detection_standards
  - deliberation_assembly_powers
  - emergency_extension_deadlock_fallback
  - charter_court_review_standards
  - authority_certification_body_operational_governance
